name: terraform-01-vm-single

# PR      -> fmt, validate, plan (posted as a PR comment)
# merge   -> apply (waits for approval on the "production" environment)
# manual  -> apply or destroy from the Actions tab
on:
  pull_request:
    branches: [main]
    paths: ["01-vm-single/**", ".github/workflows/terraform-01-vm-single.yml"]
  push:
    branches: [main]
    paths: ["01-vm-single/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "Apply or destroy lab 01"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  id-token: write       # needed for OIDC login to Azure
  contents: read
  pull-requests: write  # needed to comment the plan on the PR

concurrency:
  group: terraform-01-vm-single
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_ssh_source_cidr: ${{ vars.SSH_SOURCE_CIDR }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: 01-vm-single

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('01-vm-single/plan.txt', 'utf8');
            const body = '### Terraform plan: 01-vm-single\n```\n' + plan.slice(-60000) + '\n```';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-24.04
    environment: production   # add yourself as a required reviewer for an approval gate
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Apply
        run: terraform apply -input=false -auto-approve

      - name: Show public IP
        run: terraform output

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Destroy lab 01
        run: terraform destroy -input=false -auto-approve
